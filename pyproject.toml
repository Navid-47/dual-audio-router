[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-audio-router"
version = "1.0.0"
description = "Route Windows system audio to two Bluetooth headphones simultaneously"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Dual Audio Router Contributors" }]
keywords = ["audio", "bluetooth", "wasapi", "loopback", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "PyAudioWPatch>=0.2.12.7",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
dual-audio-router = "dual_audio_router.gui:main"
dual-audio-router-cli = "dual_audio_router.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/dual-audio-router"
Repository = "https://github.com/YOUR_USERNAME/dual-audio-router"
Issues = "https://github.com/YOUR_USERNAME/dual-audio-router/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dual_audio_router*"]
